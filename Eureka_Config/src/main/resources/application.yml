spring:
  application:
    name: eureka_config

  config:
    import: optional:file:../.env[.properties]

  cloud:
    config:
      server:
        git:
          uri: https://github.com/viniciuss27/MS_Banco_Config.git
          username: ${GIT_USERNAME}
          password: ${GIT_PASSWORD}  
          default-label: main
          clone-on-start: true

server:
  port: 8761

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false