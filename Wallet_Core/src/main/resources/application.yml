spring:
  application:
    name: wallet-core 

  datasource:
    url: jdbc:h2:mem:walletdb 
    driver-class-name: org.h2.Driver
    username: sa
    password: 

  h2:
    console:
      enabled: true
      path: /h2-console 

  jpa:
    hibernate:
      ddl-auto: create 
    defer-datasource-initialization: true 
    show-sql: true 
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: always 

server:
  port: 8080 


springdoc:
  swagger-ui:
    path: /docs 

