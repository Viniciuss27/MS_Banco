services:
  discovery:
    build: ./Eureka
    container_name: discovery
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8761/actuator/health | grep UP || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  config-server:
    build: ./Config_Server
    container_name: config-server
    environment:
      GIT_USERNAME: ${GIT_USERNAME}
      GIT_PASSWORD: ${GIT_PASSWORD}
    ports:
      - "8888:8888"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8888/actuator/health | grep UP || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      KAFKA_LISTENERS: PLAINTEXT://:29092,CONTROLLER://:9093,PLAINTEXT_HOST://:9092

      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER

      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  wallet-pg16:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: db_wallet
    volumes:
      - wallet-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d db_wallet"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-pg:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: db_auth
    volumes:
      - auth-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d db_auth"]
      interval: 5s
      timeout: 5s
      retries: 10

  wallet-core:
    build: ./Wallet_Core
    container_name: wallet-core
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_URI: http://discovery:8761/eureka

      DB_HOST: wallet-pg16
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    ports:
      - "8080:8080"

    depends_on:
      discovery:
        condition: service_healthy

      config-server:
        condition: service_healthy

      wallet-pg16:
        condition: service_healthy

      kafka:
        condition: service_healthy


  auth:
    build: ./Auth
    container_name: auth

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_URI: http://discovery:8761/eureka

      DB_HOST: auth-pg
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}

    depends_on:
      discovery:
        condition: service_healthy

      config-server:
        condition: service_healthy

      auth-pg:
        condition: service_healthy


  notification:
    build: ./Notification
    container_name: notification

    environment:
      SPRING_PROFILES_ACTIVE: prod
      EUREKA_URI: http://discovery:8761/eureka

      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      discovery:
        condition: service_healthy

      kafka:
        condition: service_healthy


  gateway:
    build: ./Gateway
    container_name: gateway

    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_CLOUD_CONFIG_URI: http://config-server:8888
      EUREKA_URI: http://discovery:8761/eureka

      JWT_SECRET: ${JWT_SECRET}

    ports:
      - "8765:8765"

    depends_on:
      discovery:
        condition: service_healthy

      config-server:
        condition: service_healthy

      auth:
        condition: service_started

      wallet-core:
        condition: service_started


networks:
  default:
    name: wallet-net


volumes:
  wallet-pg-data:
  auth-pg-data: